# Draws a pixel snake eating the contribution graph, daily, into the
# "output" branch. The profile README shows it in light and dark mode.
name: Contribution snake

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch: # allow a manual run from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#3f6bff&color_dots=#ebedf0,#fff3c4,#ffe17a,#ffcf3f,#c79a00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffcf3f&color_dots=#161b22,#1b1f3b,#2f4bd8,#3f6bff,#8aa4ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
